<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isabel–Merida District</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* Layout idea: light masthead + "next Sabbath" card, then the 15-church directory as the main event. */
:root{
  --bg:#f6fafd;
  --surface:#ffffff;
  --ink:#14263a;
  --muted:#5a6f84;
  --line:#d8e5ef;
  --blue:#1c6fb5;
  --blue-soft:#e3f0fa;
  --gold:#e3a72b;
  --gold-soft:#fdf3d9;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1824;--surface:#14222f;--ink:#e8f1f8;--muted:#9bb0c3;--line:#26394b;
    --blue:#6bb4ee;--blue-soft:#17304a;--gold:#f0bb4a;--gold-soft:#3a2f12;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1824;--surface:#14222f;--ink:#e8f1f8;--muted:#9bb0c3;--line:#26394b;
  --blue:#6bb4ee;--blue-soft:#17304a;--gold:#f0bb4a;--gold-soft:#3a2f12;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:56px 0 8px}
.section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.section-head h2{font-size:clamp(1.6rem,4vw,2.1rem)}
.section-head p{color:var(--muted);max-width:60ch}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:1.15rem}
.brand .mark{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%;object-fit:contain}
nav.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;padding-bottom:2px}
nav.links::-webkit-scrollbar{display:none}
nav.links a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.links a:hover{background:var(--blue-soft);color:var(--ink)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.lang:hover{border-color:var(--blue)}
@media(min-width:860px){nav.links{order:0;width:auto;padding:0}.bar{flex-wrap:nowrap}}

/* notice */
.notice{background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:.88rem;padding:8px 0;color:var(--ink)}

/* hero */
.hero{padding:44px 0 8px}
.hero-grid{display:grid;gap:28px;grid-template-columns:1fr;align-items:center}
@media(min-width:860px){.hero-grid{grid-template-columns:1.25fr 1fr}}
.kicker{font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);margin:8px 0 14px}
.hero p.sub{font-size:1.1rem;color:var(--muted);max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn.primary{color:#0d1824}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1824}}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:hover{filter:brightness(1.06)}
.sabbath{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--gold)}
.sabbath .label{font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sabbath .date{font-family:var(--display);font-size:2rem;line-height:1.1}
.sabbath .time{font-weight:600}
.sabbath .hint{color:var(--muted);font-size:.92rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}

/* announcements */
.news-list{display:grid;gap:14px}
.news{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:6px}
.news.pin{border-left:6px solid var(--gold)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem}
.tag{background:var(--blue-soft);color:var(--blue);padding:2px 10px;border-radius:999px;font-weight:700;font-size:.78rem}
.tag.gold{background:var(--gold-soft);color:var(--ink)}
.news h3{font-size:1.25rem}
.news p{max-width:70ch}

/* churches */
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1824}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1824}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.church{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:150px}
.church:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(28,111,181,.12)}
.church h3{font-size:1.2rem}
.church .where{color:var(--muted);font-size:.92rem}
.church .times{margin-top:auto;font-size:.9rem;font-weight:600}
.church.soon{border-style:dashed;background:transparent}
.church.soon .times{color:var(--muted);font-weight:500}
.empty{color:var(--muted);padding:20px 0}

/* dialog */
dialog{border:none;border-radius:20px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:26px;display:grid;gap:14px}
.dlg h3{font-size:1.6rem}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.dlg dt{color:var(--muted);font-weight:600}
.dlg dd{margin:0;overflow-wrap:anywhere}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap}

/* events */
.events{display:grid;gap:12px}
.event{display:grid;grid-template-columns:64px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;align-items:center}
.dateblock{background:var(--blue-soft);border-radius:12px;text-align:center;padding:8px 0;line-height:1.1}
.dateblock b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums}
.dateblock span{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.event h3{font-size:1.12rem}

/* ministries + leaders */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;border-top:4px solid var(--blue)}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.93rem}
.leader{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.leader small{color:var(--muted);font-weight:600;display:block}
.leader b{font-size:1.05rem}
.leader .tba{color:var(--muted);font-weight:500}

/* member check */
.verify{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px;border-top:6px solid var(--blue)}
.verify form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.verify label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.verify input{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%;text-transform:none}
.vres{border-radius:14px;padding:14px 18px;font-weight:600}
.vres.yes{background:var(--blue-soft);border:1px solid var(--blue)}
.vres.no{background:var(--gold-soft);border:1px solid var(--gold)}
.vres small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.fine{color:var(--muted);font-size:.9rem;max-width:70ch}

/* contact + footer */
.contact{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:10px}
.contact div{display:flex;gap:12px;flex-wrap:wrap}
.contact dt,.contact b{min-width:90px;color:var(--muted);font-weight:600}
footer{margin-top:64px;border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<div class="notice" id="notice" hidden><div class="wrap" data-i18n="sample_notice"></div></div>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Home">
      <span class="mark">
        <img src="logo.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:'<svg width=&quot;24&quot; height=&quot;24&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.8&quot; stroke-linejoin=&quot;round&quot; stroke-linecap=&quot;round&quot; style=&quot;color:var(--blue)&quot;><path d=&quot;M12 6.5C10 5 7 4.5 3.5 5v13c3.500-.5 6.500 0 8.500 1.500 2-1.500 5-2 8.500-1.500V5C17 4.500 14 5 12 6.500z&quot;/><path d=&quot;M12 6.500v13&quot;/></svg>'}))">
      </span>
      <span id="brandName">Isabel–Merida District</span>
    </a>
    <nav class="links" aria-label="Sections">
      <a href="#churches" data-i18n="nav_churches"></a>
      <a href="#news" data-i18n="nav_news"></a>
      <a href="#events" data-i18n="nav_events"></a>
      <a href="#ministries" data-i18n="nav_ministries"></a>
      <a href="#leaders" data-i18n="nav_leaders"></a>
      <a href="#verify" data-i18n="nav_verify"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <button class="lang" id="langBtn" type="button"></button>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div class="hero-grid">
      <div>
        <div class="kicker" data-i18n="kicker"></div>
        <h1 id="heroName">Isabel–Merida District</h1>
        <p class="sub" id="heroSub"></p>
        <div class="cta">
          <a class="btn primary" href="#churches" data-i18n="btn_find"></a>
          <a class="btn ghost" href="#events" data-i18n="btn_events"></a>
        </div>
      </div>
      <aside class="sabbath" aria-live="polite">
        <div class="label" id="sbLabel"></div>
        <div class="date" id="sbDate"></div>
        <div class="time" id="sbTime"></div>
        <div class="hint" data-i18n="sabbath_hint"></div>
      </aside>
    </div>
    <div class="stats" id="stats"></div>
  </div>

  <section id="news"><div class="wrap">
    <div class="section-head"><h2 data-i18n="news_title"></h2></div>
    <div class="news-list" id="newsList"></div>
  </div></section>

  <section id="churches"><div class="wrap">
    <div class="section-head">
      <h2 data-i18n="churches_title"></h2>
      <p data-i18n="churches_lead"></p>
    </div>
    <div class="tools">
      <input class="search" id="search" type="search" autocomplete="off">
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div class="grid" id="churchGrid"></div>
    <div class="empty" id="noResults" hidden data-i18n="no_results"></div>
  </div></section>

  <section id="events"><div class="wrap">
    <div class="section-head"><h2 data-i18n="events_title"></h2></div>
    <div class="events" id="eventList"></div>
  </div></section>

  <section id="ministries"><div class="wrap">
    <div class="section-head"><h2 data-i18n="min_title"></h2><p data-i18n="min_lead"></p></div>
    <div class="cards" id="minList"></div>
  </div></section>

  <section id="leaders"><div class="wrap">
    <div class="section-head"><h2 data-i18n="leaders_title"></h2></div>
    <div class="cards" id="leaderList"></div>
  </div></section>

  <section id="verify"><div class="wrap">
    <div class="section-head"><h2 data-i18n="verify_title"></h2><p data-i18n="verify_lead"></p></div>
    <div class="verify">
      <form id="verifyForm" autocomplete="off">
        <label for="vId"><span data-i18n="verify_id"></span><input id="vId" required placeholder="IM-TBD-0001-XX" autocapitalize="characters" spellcheck="false"></label>
        <label for="vName"><span data-i18n="verify_last"></span><input id="vName" required></label>
        <button class="btn primary" type="submit" id="vBtn" data-i18n="verify_btn"></button>
      </form>
      <div id="vOut" role="status" aria-live="polite"></div>
      <p class="fine" data-i18n="verify_fine"></p>
    </div>
  </div></section>

  <section id="contact"><div class="wrap">
    <div class="section-head"><h2 data-i18n="contact_title"></h2></div>
    <div class="contact" id="contactBox"></div>
  </div></section>
</main>

<footer><div class="wrap" id="footer"></div></footer>

<dialog id="dlg" aria-labelledby="dlgTitle"><div class="dlg" id="dlgBody"></div></dialog>

<script>
/* ============================================================
   EDIT HERE. Everything the district needs to change is in CONFIG.
   Optional: publish Google Sheet tabs as CSV and paste the links in
   `sheets` so officers can update content without touching code.
   Sheet columns (row 1 = headers, lowercase):
     churches:      name, municipality, barangay, sabbath, midweek, leader, phone, facebook, website, notes
     announcements: title, date (YYYY-MM-DD), church, body, pinned (yes/no)
     events:        title, date (YYYY-MM-DD), time, place, church, description
   ============================================================ */
const CONFIG = {
  districtName: 'Isabel–Merida District',
  defaultSabbath: 'Sabbath School 9:00 AM · Divine Service 10:00 AM',
  showSampleNotice: true,
  sheets: { churches: '', announcements: '', events: '' },
  /* Each church site can publish its own announcements and events as CSV (same columns as above).
     They are merged into the district lists, tagged with the church name. */
  feeds: [
    { church: 'Tubod SDA Church', announcements: '', events: '' }
  ],
  /* The Apps Script link (ending /exec) from registry-backend/Code.gs. Leave blank until it is deployed. */
  registryApi: 'https://script.google.com/macros/s/AKfycbz9WQMbKQpvTiLmwijqC-7K9d1IIZvd48fT2MgBw_dhONQcha80g137XQFyEvodHPhILA/exec',
  registryPage: 'registry.html',
  contact: { address: '', phone: '', email: '', facebook: '' },
  leaders: [
    { role: 'District Pastor', name: '' },
    { role: 'District Elder', name: '' },
    { role: 'District Secretary', name: '' },
    { role: 'District Treasurer', name: '' }
  ]
};

/* Put each church's own website in `website` (for Tubod, the address of the Tubod site) and its Facebook page in `facebook`. */
const CHURCHES = [
  { name: 'Tubod SDA Church', municipality: 'Isabel', barangay: 'Tubod',
    sabbath: '', midweek: 'Wednesday and Friday, 7:00 PM', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/Tubod-SDA/', notes: '' },
  { name: 'Apale SDA Church', municipality: 'Isabel', barangay: 'Apale', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/apale/', notes: '' },
  { name: 'Isabel SDA Church', municipality: 'Isabel', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/isabel/', notes: '' },
  { name: 'Simangan SDA Church', municipality: 'Isabel', barangay: 'Simangan', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/simangan/', notes: '' },
  { name: 'Puting Bato SDA Church', municipality: 'Isabel', barangay: 'Puting Bato', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/puting-bato/', notes: '' },
  { name: 'Bantigue SDA Church', municipality: 'Isabel', barangay: 'Bantigue', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/bantigue/', notes: '' },
  { name: 'San Francisco SDA Church', municipality: 'Isabel', barangay: 'San Francisco', 
    sabbath: '', midweek: '', leader: '', phone: '', facebook: '', website: 'https://mvcashbel-art.github.io/isabel-merida-district/churches/san-francisco/', notes: '' }
];
/* Churches still to be named: the other five in Isabel and the three in Merida. */
for (let i = 8; i <= 12; i++) CHURCHES.push({ name: 'Isabel Church ' + i, municipality: 'Isabel', placeholder: true });
for (let i = 1; i <= 3; i++) CHURCHES.push({ name: 'Merida Church ' + i, municipality: 'Merida', placeholder: true });

const ANNOUNCEMENTS = [
  { title: 'Welcome to the district website', date: '2026-11-09', church: '', pinned: 'yes',
    body: 'All fifteen churches of Isabel and Merida now have one place for announcements, events and church details.' },
  { title: 'Sabbath School teachers meeting', date: '2026-11-07', church: '',
    body: 'Teachers from every church are invited to plan next quarter together. Details will follow from the district.' }
];
const EVENTS = [
  { title: 'District Sabbath fellowship', date: '2026-11-28', time: '9:00 AM', place: 'To be announced', church: '', description: 'All fifteen churches worship together.' },
  { title: 'Adventist Youth rally', date: '2026-12-05', time: '2:00 PM', place: 'To be announced', church: '', description: 'Music, testimonies and service projects.' },
  { title: 'Christmas program', date: '2026-12-19', time: '4:00 PM', place: 'To be announced', church: '', description: 'Songs and readings from the churches of the district.' }
];

const MINISTRIES = [
  { en: ['Sabbath School', 'Weekly Bible study and fellowship in every church.'], ceb: ['Eskwelahan sa Igpapahulay', 'Semana-semana nga pagtuon sa Bibliya ug panag-uban sa matag simbahan.'] },
  { en: ['Adventist Youth', 'Young people serving, learning and growing together.'], ceb: ['Adventist Youth', 'Mga batan-on nga nag-alagad, nagkat-on, ug nagtubo nga magkauban.'] },
  { en: ['Pathfinders and Adventurers', 'Outdoor learning and service for children and teens.'], ceb: ['Pathfinders ug Adventurers', 'Pagkat-on ug pag-alagad sa gawas alang sa mga bata ug tin-edyer.'] },
  { en: ['Children’s Ministries', 'Bible stories, songs and activities for the youngest members.'], ceb: ['Ministeryo sa mga Bata', 'Mga sugilanon sa Bibliya, awit, ug kalihokan alang sa gagmay nga mga miyembro.'] },
  { en: ['Health and Temperance', 'Healthy living, community health talks and outreach.'], ceb: ['Panglawas ug Pagpugong sa Kaugalingon', 'Himsog nga pagkinabuhi, health talks, ug outreach sa komunidad.'] },
  { en: ['Women’s Ministries', 'Fellowship, prayer and service led by women.'], ceb: ['Ministeryo sa Kababayen-an', 'Panag-uban, pag-ampo, ug pag-alagad nga gipangulohan sa kababayen-an.'] },
  { en: ['Men’s Ministries', 'Brotherhood, mentoring and service.'], ceb: ['Ministeryo sa Kalalakin-an', 'Panag-igsoon, paggiya, ug pag-alagad.'] },
  { en: ['Community Services', 'Helping neighbors in need, including disaster response.'], ceb: ['Serbisyo sa Komunidad', 'Pagtabang sa mga silingan nga nanginahanglan, lakip ang tabang sa kalamidad.'] }
];

const I18N = {
  en: {
    nav_churches: 'Churches', nav_news: 'Announcements', nav_events: 'Events', nav_ministries: 'Ministries', nav_leaders: 'Leaders', nav_contact: 'Contact', nav_verify: 'Verify a member',
    verify_title: 'Verify a member',
    verify_lead: 'Not sure if someone really belongs to one of our churches? Check their membership ID here.',
    verify_id: 'Member ID', verify_last: 'Last name', verify_btn: 'Check',
    verify_fine: 'A match confirms the ID and last name belong to an active member. It does not prove who the person is, so ask to see a valid ID too. Never send money to someone only because they say they are Adventist. If in doubt, call the church clerk.',
    verify_yes: 'Active member of {c}.', verify_yes_s: 'The ID and last name match our records.',
    verify_no: 'We could not confirm this person as an active member.', verify_no_s: 'Check the spelling, or ask the church clerk before trusting or helping this person.',
    verify_off: 'Member checking is not switched on yet.', verify_err: 'The check could not be completed. Try again.',

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
let lang = 'en';
try { const s = localStorage.getItem('district-lang'); if (s === 'ceb' || s === 'en') lang = s; } catch (e) {}
const T = k => (I18N[lang][k] != null ? I18N[lang][k] : I18N.en[k]) || k;
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmt = (d, o) => d.toLocaleDateString('en-PH', o);

const state = { churches: CHURCHES, announcements: ANNOUNCEMENTS, events: EVENTS, filter: 'all', q: '', usingSample: true };

function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  if (!rows.length) return [];
  const keys = rows[0].map(x => x.trim().toLowerCase());
  return rows.slice(1).filter(x => x.some(v => v.trim())).map(x => Object.fromEntries(keys.map((k, i) => [k, (x[i] || '').trim()])));
}
async function loadSheets() {
  const s = CONFIG.sheets; let any = 0;
  const get = async url => { const res = await fetch(url); if (!res.ok) throw new Error(res.status); return parseCSV(await res.text()); };
  try {
    if (s.churches) { const rows = await get(s.churches); if (rows.length) { state.churches = rows.map(r => ({ ...r, municipality: /merida/i.test(r.municipality) ? 'Merida' : 'Isabel' })); any++; } }
    if (s.announcements) { state.announcements = await get(s.announcements); any++; }
    if (s.events) { state.events = await get(s.events); any++; }
  } catch (e) { console.warn('Sheet load failed, showing built-in content.', e); }
  /* per-church feeds: merged in, tagged with the church name */
  for (const f of CONFIG.feeds || []) {
    for (const kind of ['announcements', 'events']) {
      if (!f[kind]) continue;
      try {
        const rows = (await get(f[kind])).map(r => ({ ...r, church: f.church }));
        if (!any) state[kind] = [];            /* first real data replaces the built-in samples */
        state[kind] = state[kind].concat(rows); any++;
      } catch (e) { console.warn('Feed failed for ' + f.church, e); }
    }
  }
  state.usingSample = any === 0;
}

/* ---------- render ---------- */
function applyStatic() {
  document.documentElement.lang = lang === 'ceb' ? 'ceb' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  $('#search').placeholder = T('search_ph');
  $('#search').setAttribute('aria-label', T('search_ph'));
  $('#langBtn').textContent = T('lang_btn');
  $('#brandName').textContent = CONFIG.districtName;
  $('#heroName').textContent = CONFIG.districtName;
  document.title = CONFIG.districtName;
  $('#notice').hidden = !(CONFIG.showSampleNotice && state.usingSample);
}
function renderHero() {
  const n = state.churches.length;
  $('#heroSub').textContent = T('hero_sub').replace('{n}', n);
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const add = (6 - today.getDay() + 7) % 7; const sab = new Date(today); sab.setDate(today.getDate() + add);
  $('#sbLabel').textContent = add === 0 ? T('sabbath_today') : T('sabbath_next');
  $('#sbDate').textContent = fmt(sab, { weekday: 'long', month: 'long', day: 'numeric' });
  $('#sbTime').textContent = CONFIG.defaultSabbath;
  const isa = state.churches.filter(c => c.municipality === 'Isabel').length;
  $('#stats').innerHTML = [[n, T('stat_churches')], [isa, T('stat_isabel')], [n - isa, T('stat_merida')]]
    .map(([a, b]) => `<div class="stat"><b>${a}</b><span>${esc(b)}</span></div>`).join('');
}
function renderNews() {
  const list = [...state.announcements].sort((a, b) => {
    const pa = /^(yes|true|1)$/i.test(a.pinned || ''), pb = /^(yes|true|1)$/i.test(b.pinned || '');
    if (pa !== pb) return pa ? -1 : 1;
    return (pd(b.date) || 0) - (pd(a.date) || 0);
  });
  $('#newsList').innerHTML = list.length ? list.map(a => {
    const pin = /^(yes|true|1)$/i.test(a.pinned || ''); const d = pd(a.date);
    return `<article class="news${pin ? ' pin' : ''}">
      <div class="meta">${pin ? `<span class="tag gold">${esc(T('pinned'))}</span>` : ''}
        <span class="tag">${esc(a.church || T('whole'))}</span>${d ? `<span>${esc(fmt(d, { month: 'short', day: 'numeric', year: 'numeric' }))}</span>` : ''}</div>
      <h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></article>`;
  }).join('') : `<div class="empty">${esc(T('news_empty'))}</div>`;
}
function renderChips() {
  const n = state.churches.length, isa = state.churches.filter(c => c.municipality === 'Isabel').length;
  const defs = [['all', T('all'), n], ['Isabel', 'Isabel', isa], ['Merida', 'Merida', n - isa]];
  $('#chips').innerHTML = defs.map(([k, l, c]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${state.filter === k}">${esc(l)} (${c})</button>`).join('');
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.churches.filter(c => (state.filter === 'all' || c.municipality === state.filter) &&
    (!q || [c.name, c.barangay, c.municipality].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.municipality.localeCompare(b.municipality) || a.name.localeCompare(b.name, undefined, { numeric: true }));
}
const isSoon = c => c.placeholder === true;
function renderChurches() {
  const list = filtered();
  $('#noResults').hidden = list.length > 0;
  $('#churchGrid').innerHTML = list.map(c => {
    const idx = state.churches.indexOf(c);
    const where = [c.barangay, c.municipality + ', Leyte'].filter(Boolean).join(', ');
    return `<button class="church${isSoon(c) ? ' soon' : ''}" type="button" data-i="${idx}">
      <span class="tag" style="align-self:flex-start">${esc(c.municipality)}</span>
      <h3>${esc(c.name)}</h3><div class="where">${esc(where)}</div>
      <div class="times">${isSoon(c) ? esc(T('soon')) : esc(c.sabbath || CONFIG.defaultSabbath)}</div></button>`;
  }).join('');
}
function renderEvents() {
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = state.events.map(e => ({ ...e, _d: pd(e.date) })).filter(e => e._d && e._d >= today).sort((a, b) => a._d - b._d);
  $('#eventList').innerHTML = list.length ? list.map(e => `<article class="event">
      <div class="dateblock"><span>${esc(fmt(e._d, { month: 'short' }))}</span><b>${e._d.getDate()}</b></div>
      <div><h3>${esc(e.title)}</h3>
        <div class="meta">${[e.time, e.place, e.church || T('whole')].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span>·</span>')}</div>
        ${e.description ? `<p>${esc(e.description)}</p>` : ''}</div></article>`).join('')
    : `<div class="empty">${esc(T('events_empty'))}</div>`;
}
function renderMinistries() {
  $('#minList').innerHTML = MINISTRIES.map(m => { const t = m[lang] || m.en; return `<div class="card"><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p></div>`; }).join('');
}
function renderLeaders() {
  $('#leaderList').innerHTML = CONFIG.leaders.map(l => `<div class="leader"><small>${esc(l.role)}</small>${l.name ? `<b>${esc(l.name)}</b>` : `<span class="tba">${esc(T('tba'))}</span>`}</div>`).join('');
}
function renderContact() {
  const c = CONFIG.contact; const rows = [];
  if (c.address) rows.push([T('c_address'), esc(c.address)]);
  if (c.phone) rows.push([T('c_phone'), esc(c.phone)]);
  if (c.email) rows.push([T('c_email'), esc(c.email)]);
  if (safeUrl(c.facebook)) rows.push([T('c_facebook'), `<a href="${esc(c.facebook)}" target="_blank" rel="noopener">${esc(c.facebook)}</a>`]);
  $('#contactBox').innerHTML = rows.length ? rows.map(r => `<div><b>${esc(r[0])}</b><span>${r[1]}</span></div>`).join('') : `<span class="empty" style="padding:0">${esc(T('contact_empty'))}</span>`;
}
function renderFooter() {
  const f = $('#footer');
  f.textContent = T('footer').replace('{d}', CONFIG.districtName + ' · ' + new Date().getFullYear()) + ' · ';
  const a = document.createElement('a'); a.href = CONFIG.registryPage; a.textContent = T('registry_link'); f.appendChild(a);
}

/* ---------- member check ---------- */
function showVerify(kind, church) {
  const o = $('#vOut');
  if (kind === 'yes') o.innerHTML = `<div class="vres yes">${esc(T('verify_yes').replace('{c}', church))}<small>${esc(T('verify_yes_s'))}</small></div>`;
  else if (kind === 'no') o.innerHTML = `<div class="vres no">${esc(T('verify_no'))}<small>${esc(T('verify_no_s'))}</small></div>`;
  else o.innerHTML = `<div class="vres no">${esc(kind === 'off' ? T('verify_off') : (kind || T('verify_err')))}</div>`;
}
$('#verifyForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!CONFIG.registryApi) { showVerify('off'); return; }
  $('#vBtn').disabled = true; $('#vOut').textContent = '';
  try {
    const res = await fetch(CONFIG.registryApi, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'publicVerify', id: $('#vId').value, lastName: $('#vName').value }), redirect: 'follow' });
    const r = await res.json();
    if (!r.ok) showVerify(r.error); else if (r.valid) showVerify('yes', r.church); else showVerify('no');
  } catch (err) { showVerify(); }
  $('#vBtn').disabled = false;
});
/* An ID card's QR code opens this page as  #verify-IM-TBD-0001-XX  and fills in the ID. */
function readVerifyHash() {
  const m = /^#verify-([A-Za-z0-9-]{6,30})$/.exec(location.hash);
  if (m) { $('#vId').value = m[1].toUpperCase(); $('#vName').focus({ preventScroll: true }); $('#verify').scrollIntoView(); }
}
window.addEventListener('hashchange', readVerifyHash);
function openChurch(i) {
  const c = state.churches[i]; if (!c) return;
  const where = [c.barangay, c.municipality, 'Leyte'].filter(Boolean).join(', ');
  const q = encodeURIComponent([c.name, c.barangay, c.municipality, 'Leyte, Philippines'].filter(Boolean).join(', '));
  const rows = [];
  if (!isSoon(c)) {
    rows.push([T('l_where'), esc(where)]);
    rows.push([T('l_sabbath'), esc(c.sabbath || CONFIG.defaultSabbath)]);
    if (c.midweek) rows.push([T('l_midweek'), esc(c.midweek)]);
    if (c.leader) rows.push([T('l_leader'), esc(c.leader)]);
    if (c.phone) rows.push([T('l_phone'), `<a href="tel:${esc(c.phone.replace(/[^\d+]/g, ''))}">${esc(c.phone)}</a>`]);
    if (c.notes) rows.push([T('l_notes'), esc(c.notes)]);
  }
  const links = [];
  if (safeUrl(c.facebook)) links.push(`<a class="btn ghost" href="${esc(c.facebook)}" target="_blank" rel="noopener">${esc(T('facebook'))}</a>`);
  if (safeUrl(c.website)) links.push(`<a class="btn ghost" href="${esc(c.website)}" target="_blank" rel="noopener">${esc(T('website'))}</a>`);
  $('#dlgBody').innerHTML = `<span class="tag" style="justify-self:start">${esc(c.municipality)}</span>
    <h3 id="dlgTitle">${esc(c.name)}</h3>
    ${isSoon(c) ? `<p class="empty" style="padding:0">${esc(T('soon'))}</p><p class="where" style="color:var(--muted)">${esc(where)}</p>` : `<dl>${rows.map(r => `<dt>${esc(r[0])}</dt><dd>${r[1]}</dd>`).join('')}</dl>`}
    <div class="row">
      ${isSoon(c) ? '' : `<a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${esc(T('directions'))}</a>`}
      ${links.join('')}
      <button class="btn ghost" type="button" id="dlgClose">${esc(T('close'))}</button>
    </div>`;
  $('#dlgClose').onclick = () => $('#dlg').close();
  $('#dlg').showModal();
}

function renderAll() {
  applyStatic(); renderHero(); renderNews(); renderChips(); renderChurches();
  renderEvents(); renderMinistries(); renderLeaders(); renderContact(); renderFooter();
}

/* ---------- events ---------- */
$('#langBtn').addEventListener('click', () => {
  lang = lang === 'en' ? 'ceb' : 'en';
  try { localStorage.setItem('district-lang', lang); } catch (e) {}
  renderAll();
});
$('#search').addEventListener('input', e => { state.q = e.target.value; renderChurches(); });
$('#chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; state.filter = b.dataset.k; renderChips(); renderChurches(); });
$('#churchGrid').addEventListener('click', e => { const b = e.target.closest('.church'); if (b) openChurch(+b.dataset.i); });
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });

renderAll();
readVerifyHash();
loadSheets().then(renderAll);
</script>
