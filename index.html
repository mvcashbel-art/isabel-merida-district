<style>
/* Layout idea: light masthead + "next Sabbath" card, then the 15-church directory as the main event. */
:root{
  --bg:#f2f7ff;--surface:#ffffff;--ink:#10233f;--muted:#55678a;--line:#d6e4f8;
  --blue:#1d5fd8;--blue-soft:#e4eeff;--teal:#0e9f9a;--teal-soft:#d9f5f2;--teal-ink:#0a6b68;
  --gold:#f0a30a;--gold-soft:#fff1cf;--coral:#e8604f;--coral-soft:#ffe6e2;--coral-ink:#a8321f;--violet:#6d4df2;
  --grad:linear-gradient(135deg,#1d5fd8,#0e9f9a);
  --grad-warm:linear-gradient(135deg,#f0a30a,#e8604f);
  --vgrad:linear-gradient(135deg,#1b4fbf 0%,#0a7f86 75%,#1b9a86 100%);
  --on-accent:#ffffff;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1226;--surface:#121c36;--ink:#eaf1ff;--muted:#9fb0cf;--line:#233256;
    --blue:#6aa2ff;--blue-soft:#162a52;--teal:#35d0c8;--teal-soft:#0f3a3d;--teal-ink:#5fe0d8;
    --gold:#ffbf3f;--gold-soft:#3d2f0e;--coral:#ff8a7a;--coral-soft:#4a1f1b;--coral-ink:#ff9d8f;--violet:#9b86ff;
    --grad:linear-gradient(135deg,#6aa2ff,#35d0c8);
    --grad-warm:linear-gradient(135deg,#ffbf3f,#ff8a7a);
    --vgrad:linear-gradient(135deg,#142a5e 0%,#0a5560 100%);
    --on-accent:#08122a;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1226;--surface:#121c36;--ink:#eaf1ff;--muted:#9fb0cf;--line:#233256;
  --blue:#6aa2ff;--blue-soft:#162a52;--teal:#35d0c8;--teal-soft:#0f3a3d;--teal-ink:#5fe0d8;
  --gold:#ffbf3f;--gold-soft:#3d2f0e;--coral:#ff8a7a;--coral-soft:#4a1f1b;--coral-ink:#ff9d8f;--violet:#9b86ff;
  --grad:linear-gradient(135deg,#6aa2ff,#35d0c8);
  --grad-warm:linear-gradient(135deg,#ffbf3f,#ff8a7a);
  --vgrad:linear-gradient(135deg,#142a5e 0%,#0a5560 100%);
  --on-accent:#08122a;color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
section{padding:56px 0 8px}
.section-head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px}
.section-head h2{font-size:clamp(1.6rem,4vw,2.1rem)}
.section-head p{color:var(--muted);max-width:60ch}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--display);font-size:1.15rem}
.brand .mark{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;overflow:hidden;flex:none}
.brand .mark img{width:100%;height:100%;object-fit:contain}
nav.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;padding-bottom:2px}
nav.links::-webkit-scrollbar{display:none}
nav.links a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.links a:hover{background:var(--blue-soft);color:var(--ink)}
.lang{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.88rem;cursor:pointer}
.lang:hover{border-color:var(--blue)}
@media(min-width:860px){nav.links{order:0;width:auto;padding:0}.bar{flex-wrap:nowrap}}

/* notice */
.notice{background:var(--gold-soft);border-bottom:1px solid var(--line);font-size:.88rem;padding:8px 0;color:var(--ink)}

/* hero */
.hero{padding:44px 0 8px}
.hero-grid{display:grid;gap:28px;grid-template-columns:1fr;align-items:center}
@media(min-width:860px){.hero-grid{grid-template-columns:1.25fr 1fr}}
.kicker{font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.hero h1{font-size:clamp(2.2rem,7vw,3.6rem);margin:8px 0 14px}
.hero p.sub{font-size:1.1rem;color:var(--muted);max-width:46ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;font-weight:700;text-decoration:none;border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn.primary{color:#0d1824}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1824}}
.btn.ghost{background:transparent;color:var(--blue)}
.btn:hover{filter:brightness(1.06)}
.sabbath{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--gold)}
.sabbath .label{font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sabbath .date{font-family:var(--display);font-size:2rem;line-height:1.1}
.sabbath .time{font-weight:600}
.sabbath .hint{color:var(--muted);font-size:.92rem}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}

/* announcements */
.news-list{display:grid;gap:14px}
.news{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:6px}
.news.pin{border-left:6px solid var(--gold)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.88rem}
.tag{background:var(--blue-soft);color:var(--blue);padding:2px 10px;border-radius:999px;font-weight:700;font-size:.78rem}
.tag.gold{background:var(--gold-soft);color:var(--ink)}
.news h3{font-size:1.25rem}
.news p{max-width:70ch}

/* churches */
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;align-items:center}
.search{flex:1 1 240px;min-width:0;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0d1824}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0d1824}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.church{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:150px}
.church:hover{border-color:var(--blue);box-shadow:0 6px 18px rgba(28,111,181,.12)}
.church h3{font-size:1.2rem}
.church .where{color:var(--muted);font-size:.92rem}
.church .times{margin-top:auto;font-size:.9rem;font-weight:600}
.church.soon{border-style:dashed;background:transparent}
.church.soon .times{color:var(--muted);font-weight:500}
.empty{color:var(--muted);padding:20px 0}

/* dialog */
dialog{border:none;border-radius:20px;padding:0;max-width:min(520px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dlg{padding:26px;display:grid;gap:14px}
.dlg h3{font-size:1.6rem}
.dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.dlg dt{color:var(--muted);font-weight:600}
.dlg dd{margin:0;overflow-wrap:anywhere}
.dlg .row{display:flex;gap:10px;flex-wrap:wrap}

/* events */
.events{display:grid;gap:12px}
.event{display:grid;grid-template-columns:64px 1fr;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;align-items:center}
.dateblock{background:var(--blue-soft);border-radius:12px;text-align:center;padding:8px 0;line-height:1.1}
.dateblock b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;font-variant-numeric:tabular-nums}
.dateblock span{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.event h3{font-size:1.12rem}

/* ministries + leaders */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;border-top:4px solid var(--blue)}
.card h3{font-size:1.1rem;margin-bottom:6px}
.card p{color:var(--muted);font-size:.93rem}
.leader{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.leader small{color:var(--muted);font-weight:600;display:block}
.leader b{font-size:1.05rem}
.leader .tba{color:var(--muted);font-weight:500}

/* member check */
.verify{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:14px;border-top:6px solid var(--blue)}
.verify form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.verify label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.verify input{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%;text-transform:none}
.vres{border-radius:14px;padding:14px 18px;font-weight:600}
.vres.yes{background:var(--blue-soft);border:1px solid var(--blue)}
.vres.no{background:var(--gold-soft);border:1px solid var(--gold)}
.vres small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.fine{color:var(--muted);font-size:.9rem;max-width:70ch}

/* contact + footer */
.contact{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:grid;gap:10px}
.contact div{display:flex;gap:12px;flex-wrap:wrap}
.contact dt,.contact b{min-width:90px;color:var(--muted);font-weight:600}
footer{margin-top:64px;border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.9rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* ===== v2: colour, motion and new sections ===== */
body{background:var(--bg);background-image:radial-gradient(900px 500px at 85% -5%,color-mix(in srgb,var(--blue) 10%,transparent),transparent 70%),radial-gradient(700px 420px at -5% 12%,color-mix(in srgb,var(--teal) 9%,transparent),transparent 70%);background-repeat:no-repeat}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--teal),var(--gold));z-index:60;transition:width .12s linear}
main{position:relative}
.aurora{position:absolute;inset:0 0 auto 0;height:760px;overflow:hidden;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.aurora i{position:absolute;border-radius:50%;filter:blur(64px);animation:float 20s ease-in-out infinite}
.aurora i:nth-child(1){width:440px;height:440px;left:-90px;top:-80px;background:color-mix(in srgb,var(--blue) 34%,transparent)}
.aurora i:nth-child(2){width:380px;height:380px;right:-60px;top:40px;background:color-mix(in srgb,var(--gold) 32%,transparent);animation-delay:-7s;animation-duration:24s}
.aurora i:nth-child(3){width:340px;height:340px;left:38%;top:160px;background:color-mix(in srgb,var(--teal) 28%,transparent);animation-delay:-13s;animation-duration:28s}
.aurora::before{content:"";position:absolute;width:1400px;height:1400px;right:-480px;top:-900px;background:conic-gradient(from 200deg,transparent 0 12%,color-mix(in srgb,var(--gold) 20%,transparent) 17%,transparent 23% 40%,color-mix(in srgb,var(--blue) 16%,transparent) 46%,transparent 52%);animation:spin 80s linear infinite}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,30px) scale(1.08)}66%{transform:translate(-30px,50px) scale(.95)}}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap.hero{position:relative;z-index:1}
.hero h1 .w{display:inline-block;opacity:0;transform:translateY(.45em);animation:wordIn .9s var(--ease) forwards;animation-delay:calc(var(--i)*.14s + .1s);background:linear-gradient(100deg,var(--ink) 35%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
@keyframes wordIn{to{opacity:1;transform:none}}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--blue-soft);padding:5px 14px;border-radius:999px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}
.btn{background:var(--grad);border-color:transparent;color:var(--on-accent);transition:transform .2s var(--ease),box-shadow .2s var(--ease),filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 35%,transparent)}
.btn.ghost{background:transparent;border-color:var(--blue);color:var(--blue)}
.btn.sm{padding:6px 14px;font-size:.88rem}
.chip{transition:background .2s,transform .2s}.chip:hover{transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:var(--on-accent)}
.hbtns{display:flex;gap:8px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:transform .2s var(--ease),border-color .2s}
.icon-btn:hover{border-color:var(--blue);transform:rotate(12deg)}
.icon-btn svg{width:20px;height:20px}
nav.links a.on{background:var(--blue-soft);color:var(--ink)}
.section-head h2::after{content:"";display:block;width:56px;height:4px;border-radius:4px;background:var(--grad);margin-top:10px}

/* Sabbath countdown card */
.sabbath{border:1px solid transparent;border-top:6px solid transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--grad-warm) border-box;box-shadow:0 18px 40px -20px color-mix(in srgb,var(--blue) 45%,transparent)}
.sabbath .cdlabel{font-weight:600;color:var(--muted);font-size:.92rem}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--blue-soft);border-radius:12px;padding:8px 4px;text-align:center}
.cd b{display:block;font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sabbath .sun,.sabbath .todayline{font-size:.88rem;color:var(--muted)}
.sabbath .todayline{font-weight:700;color:var(--teal-ink)}
.stat b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat{transition:transform .25s var(--ease)}.stat:hover{transform:translateY(-3px)}

/* verse of the day */
.verse-sec{padding-top:40px}
.verse{margin:0;border-radius:26px;padding:clamp(24px,4vw,44px);color:#fff;background:var(--vgrad);position:relative;overflow:hidden;box-shadow:0 24px 50px -28px color-mix(in srgb,var(--blue) 70%,transparent)}
.verse::before{content:"\201C";position:absolute;right:18px;top:-30px;font:400 11rem/1 var(--display);opacity:.12}
.verse .vlabel{font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin-bottom:10px}
.verse blockquote{margin:0;font:400 clamp(1.3rem,3.2vw,2rem)/1.4 var(--display);max-width:44ch;text-wrap:pretty}
.verse figcaption{margin-top:14px;font-size:1rem;opacity:.95}
.vbtns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.verse .btn.ghost{color:#fff;border-color:rgba(255,255,255,.65)}
.verse .btn.ghost:hover{background:rgba(255,255,255,.14);box-shadow:none}

/* churches */
.church{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.church:hover{transform:translateY(-4px)}
.church.m-isabel{border-top:4px solid var(--teal)}
.church.m-merida{border-top:4px solid var(--coral)}
.church.soon{border-top-width:1px}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag.isabel{background:var(--teal-soft);color:var(--teal-ink)}
.tag.merida{background:var(--coral-soft);color:var(--coral-ink)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--teal-ink);background:var(--teal-soft);padding:2px 10px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 55%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.card{transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 28px -18px color-mix(in srgb,var(--blue) 55%,transparent)}
.card:nth-child(3n+1){border-top-color:var(--blue)}.card:nth-child(3n+2){border-top-color:var(--teal)}.card:nth-child(3n){border-top-color:var(--gold)}
.dateblock{background:var(--grad);color:var(--on-accent)}
.dateblock span{color:inherit;opacity:.92}
.cal{justify-self:start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--blue);margin-top:8px}
.cal:hover{border-color:var(--blue)}

/* map */
.mapwrap{margin-top:30px;display:grid;gap:10px}
.mapwrap h3{font-size:1.3rem}
.map{height:min(62vh,460px);border-radius:20px;border:1px solid var(--line);overflow:hidden;z-index:0;background:var(--blue-soft);display:grid;place-items:center;color:var(--muted)}
.map .leaflet-popup-content-wrapper,.map .leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.map .leaflet-popup-content-wrapper{border-radius:14px}
.map .leaflet-popup-content{margin:12px 14px;line-height:1.5}
.map .leaflet-popup-content .btn{margin-top:8px;color:var(--on-accent)}
:root[data-theme="dark"] .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.8)}}
.pin-wrap{background:none;border:0}
.mpin{display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--teal);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4);position:relative}
.mpin.merida{background:var(--coral)}
.mpin::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}
.mpin.live{animation:pinPulse 1.8s infinite}
@keyframes pinPulse{0%{box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 0 0 rgba(14,159,154,.6)}70%{box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 0 14px rgba(14,159,154,0)}100%{box-shadow:0 4px 10px rgba(0,0,0,.4),0 0 0 0 rgba(14,159,154,0)}}

/* gallery */
.gal-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.gal{position:relative;padding:0;border:0;border-radius:16px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in;background:var(--blue-soft)}
.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s var(--ease)}
.gal:hover img{transform:scale(1.07)}
.gal span{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;color:#fff;font-size:.82rem;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.gal-empty{grid-column:1/-1;border:2px dashed var(--line);border-radius:20px;padding:34px 20px;display:grid;justify-items:center;gap:8px;color:var(--muted);text-align:center}
.gal-empty svg{width:44px;height:44px;color:var(--blue)}
#lb{max-width:none;max-height:none;width:100vw;height:100dvh;margin:0;inset:0;background:rgba(4,9,20,.94);color:#fff;border-radius:0}
.lbin{height:100%;display:grid;grid-template-rows:1fr auto;gap:10px;padding:16px;touch-action:pan-y}
.lbin img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;border-radius:10px;min-height:0}
.lbcap{text-align:center;font-size:.95rem;min-height:1.4em}
.lbb{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.5rem;cursor:pointer}
.lbb:hover{background:rgba(255,255,255,.3)}
.lbprev{left:12px}.lbnext{right:12px}
.lbx{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.3rem;cursor:pointer}

/* prayer form */
.verify textarea,.verify select{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;width:100%}
.verify textarea{min-height:110px;resize:vertical}
.pf .full{grid-column:1/-1}
.pf .chk{display:flex;gap:10px;align-items:center;font-weight:500}
.pf .chk input{width:auto}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.prayer{border-top-color:var(--coral)}

/* reveal on scroll */
.rv{opacity:0;transform:translateY(20px);transition:opacity .65s var(--ease),transform .65s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}


/* phone fixes */
.wrap.hero{padding-left:20px;padding-right:20px}
@media(max-width:560px){
  .brand{font-size:1rem}.brand .mark{width:34px;height:34px}
  .icon-btn{width:34px;height:34px}.icon-btn svg{width:18px;height:18px}
  .lang{padding:5px 11px;font-size:.82rem}.hbtns{gap:6px}
  .bar{gap:6px}
}

/* phone header: one row */
@media(max-width:560px){
  .brand{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem;gap:8px}
  .brand .mark{width:30px;height:30px;flex:none}
  .icon-btn{width:32px;height:32px}.icon-btn svg{width:17px;height:17px}
  .lang{padding:4px 9px;font-size:.78rem}
  .hbtns{gap:4px;flex:none}
  .bar{gap:6px 6px;flex-wrap:wrap;padding-top:8px;padding-bottom:6px}
  .brand{flex:1 1 0;min-width:0}
  nav.links{flex:0 0 100%;order:3}
  nav.links a{padding:5px 11px;font-size:.88rem}
}
@media(max-width:560px){.event .meta .sep{display:none}.event .meta{gap:2px 12px}}
/* hero title: plain colour, no clipped gradient (paints reliably) */
.hero h1 .w{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink)}
.hero h1 .w:last-child{color:var(--blue)}

/* desktop header: one line, nothing cut off */
@media(min-width:561px){.brand{white-space:nowrap;flex:none}}
@media(min-width:860px){
  header.top .wrap.bar{max-width:1320px;gap:18px}
  nav.links{flex:1 1 auto;min-width:0;justify-content:center;gap:2px}
  nav.links a{padding:6px 10px;font-size:.9rem}
}
@media(prefers-reduced-motion:reduce){
  .aurora i,.aurora::before,.live i,.mpin.live{animation:none}
  .hero h1 .w{animation:none;opacity:1;transform:none}
  .rv{opacity:1;transform:none;transition:none}
  .church:hover,.card:hover,.stat:hover,.btn:hover{transform:none}
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
let lang = 'en';
try { const s = localStorage.getItem('district-lang'); if (s === 'ceb' || s === 'en') lang = s; } catch (e) {}
const T = k => (I18N[lang][k] != null ? I18N[lang][k] : I18N.en[k]) || k;
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmt = (d, o) => d.toLocaleDateString('en-PH', o);

const state = { churches: CHURCHES, announcements: ANNOUNCEMENTS, events: EVENTS, filter: 'all', q: '', usingSample: true };

function parseCSV(t) {
  const rows = []; let r = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { r.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; r.push(f); rows.push(r); r = []; f = ''; }
    else f += c;
  }
  if (f !== '' || r.length) { r.push(f); rows.push(r); }
  if (!rows.length) return [];
  const keys = rows[0].map(x => x.trim().toLowerCase());
  return rows.slice(1).filter(x => x.some(v => v.trim())).map(x => Object.fromEntries(keys.map((k, i) => [k, (x[i] || '').trim()])));
}
async function loadSheets() {
  const s = CONFIG.sheets; let any = 0;
  const get = async url => { const res = await fetch(url); if (!res.ok) throw new Error(res.status); return parseCSV(await res.text()); };
  try {
    if (s.churches) { const rows = await get(s.churches); if (rows.length) { state.churches = rows.map(r => ({ ...r, municipality: /merida/i.test(r.municipality) ? 'Merida' : 'Isabel' })); any++; } }
    if (s.announcements) { state.announcements = await get(s.announcements); any++; }
    if (s.events) { state.events = await get(s.events); any++; }
  } catch (e) { console.warn('Sheet load failed, showing built-in content.', e); }
  /* per-church feeds: merged in, tagged with the church name */
  for (const f of CONFIG.feeds || []) {
    for (const kind of ['announcements', 'events']) {
      if (!f[kind]) continue;
      try {
        const rows = (await get(f[kind])).map(r => ({ ...r, church: f.church }));
        if (!any) state[kind] = [];            /* first real data replaces the built-in samples */
        state[kind] = state[kind].concat(rows); any++;
      } catch (e) { console.warn('Feed failed for ' + f.church, e); }
    }
  }
  state.usingSample = any === 0;
}

/* ---------- render ---------- */
function applyStatic() {
  document.documentElement.lang = lang === 'ceb' ? 'ceb' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  $('#search').placeholder = T('search_ph');
  $('#search').setAttribute('aria-label', T('search_ph'));
  $('#langBtn').textContent = T('lang_btn');
  $('#brandName').textContent = CONFIG.districtName;
  splitHero();
  document.title = CONFIG.districtName;
  $('#notice').hidden = !(CONFIG.showSampleNotice && state.usingSample);
}
function renderHero() {
  const n = state.churches.length;
  $('#heroSub').textContent = T('hero_sub').replace('{n}', n);
  const ss = sabbathState();
  $('#sbLabel').textContent = ss.on ? T('sabbath_today') : T('sabbath_next');
  $('#sbDate').textContent = fmt(ss.sat, { weekday: 'long', month: 'long', day: 'numeric' });
  $('#sbTime').textContent = CONFIG.defaultSabbath;
  const isa = state.churches.filter(c => c.municipality === 'Isabel').length;
  $('#stats').innerHTML = [[n, T('stat_churches')], [isa, T('stat_isabel')], [n - isa, T('stat_merida')]]
    .map(([a, b]) => `<div class="stat"><b data-n="${a}">${a}</b><span>${esc(b)}</span></div>`).join('');
  countUp(); renderToday(); tickCountdown();
}
function renderNews() {
  const list = [...state.announcements].sort((a, b) => {
    const pa = /^(yes|true|1)$/i.test(a.pinned || ''), pb = /^(yes|true|1)$/i.test(b.pinned || '');
    if (pa !== pb) return pa ? -1 : 1;
    return (pd(b.date) || 0) - (pd(a.date) || 0);
  });
  $('#newsList').innerHTML = list.length ? list.map(a => {
    const pin = /^(yes|true|1)$/i.test(a.pinned || ''); const d = pd(a.date);
    return `<article class="news${pin ? ' pin' : ''}">
      <div class="meta">${pin ? `<span class="tag gold">${esc(T('pinned'))}</span>` : ''}
        <span class="tag">${esc(a.church || T('whole'))}</span>${d ? `<span>${esc(fmt(d, { month: 'short', day: 'numeric', year: 'numeric' }))}</span>` : ''}</div>
      <h3>${esc(a.title)}</h3><p>${esc(a.body)}</p></article>`;
  }).join('') : `<div class="empty">${esc(T('news_empty'))}</div>`;
}
function renderChips() {
  const n = state.churches.length, isa = state.churches.filter(c => c.municipality === 'Isabel').length;
  const defs = [['all', T('all'), n], ['Isabel', 'Isabel', isa], ['Merida', 'Merida', n - isa]];
  $('#chips').innerHTML = defs.map(([k, l, c]) => `<button class="chip" type="button" data-k="${k}" aria-pressed="${state.filter === k}">${esc(l)} (${c})</button>`).join('');
}
function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.churches.filter(c => (state.filter === 'all' || c.municipality === state.filter) &&
    (!q || [c.name, c.barangay, c.municipality].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => a.municipality.localeCompare(b.municipality) || a.name.localeCompare(b.name, undefined, { numeric: true }));
}
const isSoon = c => c.placeholder === true;
function renderChurches() {
  const list = filtered();
  $('#noResults').hidden = list.length > 0;
  $('#churchGrid').innerHTML = list.map(c => {
    const idx = state.churches.indexOf(c);
    const where = [c.barangay, c.municipality + ', Leyte'].filter(Boolean).join(', ');
    return `<button class="church m-${c.municipality.toLowerCase()}${isSoon(c) ? ' soon' : ''}" type="button" data-i="${idx}">
      <span class="chead"><span class="tag ${c.municipality.toLowerCase()}">${esc(c.municipality)}</span>${worshipToday(c) ? `<span class="live"><i></i>${esc(T('today_badge'))}</span>` : ''}</span>
      <h3>${esc(c.name)}</h3><div class="where">${esc(where)}</div>
      <div class="times">${isSoon(c) ? esc(T('soon')) : esc(c.sabbath || CONFIG.defaultSabbath)}</div></button>`;
  }).join('');
  updateMap();
}
function renderEvents() {
  const now = new Date(); const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const list = state.events.map(e => ({ ...e, _d: pd(e.date) })).filter(e => e._d && e._d >= today).sort((a, b) => a._d - b._d);
  state.evList = list;
  $('#eventList').innerHTML = list.length ? list.map((e, i) => `<article class="event">
      <div class="dateblock"><span>${esc(fmt(e._d, { month: 'short' }))}</span><b>${e._d.getDate()}</b></div>
      <div><h3>${esc(e.title)}</h3>
        <div class="meta">${[e.time, e.place, e.church || T('whole')].filter(Boolean).map(x => `<span>${esc(x)}</span>`).join('<span class="sep">·</span>')}</div>
        ${e.description ? `<p>${esc(e.description)}</p>` : ''}<button class="cal" type="button" data-ev="${i}">${esc(T('cal_add'))}</button></div></article>`).join('')
    : `<div class="empty">${esc(T('events_empty'))}</div>`;
}
function renderMinistries() {
  $('#minList').innerHTML = MINISTRIES.map(m => { const t = m[lang] || m.en; return `<div class="card"><h3>${esc(t[0])}</h3><p>${esc(t[1])}</p></div>`; }).join('');
}
function renderLeaders() {
  $('#leaderList').innerHTML = CONFIG.leaders.map(l => `<div class="leader"><small>${esc(l.role)}</small>${l.name ? `<b>${esc(l.name)}</b>` : `<span class="tba">${esc(T('tba'))}</span>`}</div>`).join('');
}

/* ================= v2: Sabbath countdown, verse, map, gallery, prayer and polish ================= */
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const MNL = 8 * 3600000;                       /* Philippine time is UTC+8 */
const LAT = 10.93, LNG = 124.43;               /* Isabel, Leyte */
const manilaNow = () => new Date(Date.now() + MNL);

/* Sunset for a Manila calendar day (standard solar-position maths). */
function sunsetOn(y, m, d) {
  const rad = Math.PI / 180, dayMs = 86400000, J1970 = 2440588, J2000 = 2451545, J0 = 0.0009;
  const date = new Date(Date.UTC(y, m, d, 4, 0, 0));               /* noon in Manila */
  const lw = rad * -LNG, phi = rad * LAT, e = rad * 23.4397;
  const days = date.valueOf() / dayMs - 0.5 + J1970 - J2000;
  const n = Math.round(days - J0 - lw / (2 * Math.PI));
  const approx = Ht => J0 + (Ht + lw) / (2 * Math.PI) + n;
  const ds = approx(0);
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const w = Math.acos((Math.sin(-0.833 * rad) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const Jset = J2000 + approx(w) + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  return new Date((Jset + 0.5 - J1970) * dayMs);
}
function sabbathState() {
  const mn = manilaNow(), y = mn.getUTCFullYear(), m = mn.getUTCMonth(), d = mn.getUTCDate(), wd = mn.getUTCDay(), now = Date.now();
  const fri = Date.UTC(y, m, d - ((wd - 5 + 7) % 7));                /* most recent Friday (Manila date) */
  const sun = ms => { const x = new Date(ms); return sunsetOn(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate()); };
  const start = sun(fri), end = sun(fri + 864e5);
  let on = now >= start && now < end, target = end, sat = fri + 864e5;
  if (!on) { if (now < start) target = start; else { const nf = fri + 7 * 864e5; target = sun(nf); sat = nf + 864e5; } }
  const s = new Date(sat);
  return { on, target: +target, sat: new Date(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate()) };
}
function tickCountdown() {
  const el = $('#cd'); if (!el) return;
  const ss = sabbathState(), t = Math.max(0, ss.target - Date.now());
  const v = [Math.floor(t / 864e5), Math.floor(t % 864e5 / 36e5), Math.floor(t % 36e5 / 6e4), Math.floor(t % 6e4 / 1e3)];
  ['cdD', 'cdH', 'cdM', 'cdS'].forEach((id, i) => { $('#' + id).textContent = String(v[i]).padStart(i ? 2 : 1, '0'); });
  $('#cdLabel').textContent = T(ss.on ? 'cd_ends' : 'cd_begins');
  const when = new Date(ss.target).toLocaleString('en-PH', { timeZone: 'Asia/Manila', weekday: 'long', hour: 'numeric', minute: '2-digit' });
  $('#sunLine').textContent = T('sunset_at').replace('{t}', when);
}
const WD = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
function worshipToday(c) {
  if (isSoon(c)) return false;

/* ---------- map ---------- */
const mp = { m: null, layer: null, loading: false };
function loadLeaflet() {
  return new Promise((res, rej) => {
    if (window.L) return res();
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(l);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
function ensureMap() {
  if (mp.m || mp.loading) return; mp.loading = true;
  loadLeaflet().then(() => {
    const box = $('#map'); box.textContent = ''; box.style.display = 'block';
    mp.m = L.map('map', { scrollWheelZoom: false }).setView([10.93, 124.47], 11);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap contributors' }).addTo(mp.m);
    mp.layer = L.layerGroup().addTo(mp.m);
    mp.m.on('click', () => mp.m.scrollWheelZoom.enable());
    box.addEventListener('mouseleave', () => mp.m.scrollWheelZoom.disable());
    updateMap();
  }).catch(() => { mp.loading = false; $('#map').textContent = T('map_fail'); });
}
function updateMap() {
  if (!mp.m) return;
  mp.layer.clearLayers(); const pts = [];
  filtered().forEach(c => {
    const lat = cLat(c), lng = cLng(c); if (lat == null || lng == null) return;
    const i = state.churches.indexOf(c), where = [c.barangay, c.municipality + ', Leyte'].filter(Boolean).join(', ');
    const icon = L.divIcon({ className: 'pin-wrap', html: `<span class="mpin ${c.municipality.toLowerCase()}${worshipToday(c) ? ' live' : ''}"></span>`, iconSize: [26, 34], iconAnchor: [13, 30], popupAnchor: [0, -28] });
    L.marker([lat, lng], { icon, title: c.name, alt: c.name }).addTo(mp.layer)
      .bindPopup(`<b>${esc(c.name)}</b><br>${esc(where)}<br><button class="btn primary sm" type="button" data-i="${i}">${esc(T('details'))}</button>`);
    pts.push([lat, lng]);
  });
  if (pts.length) mp.m.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
}

/* ---------- add an event to the phone calendar ---------- */
function icsFor(e) {
  const d = e._d, p = n => String(n).padStart(2, '0'), f = x => x.getFullYear() + p(x.getMonth() + 1) + p(x.getDate());
  const tm = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i.exec(e.time || '');
  const q = s => String(s || '').replace(/([,;\\])/g, '\\$1').replace(/\r?\n/g, '\\n');
  let when;
  if (tm) {
    const h = +tm[1] % 12 + (/pm/i.test(tm[3]) ? 12 : 0), mi = +(tm[2] || 0), end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h + 2, mi);
    when = `DTSTART;TZID=Asia/Manila:${f(d)}T${p(h)}${p(mi)}00\r\nDTEND;TZID=Asia/Manila:${f(end)}T${p(end.getHours())}${p(end.getMinutes())}00`;
  } else { const nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); when = `DTSTART;VALUE=DATE:${f(d)}\r\nDTEND;VALUE=DATE:${f(nx)}`; }
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Isabel-Merida District//EN', 'BEGIN:VEVENT', 'UID:' + Date.now() + Math.random().toString(36).slice(2) + '@isabel-merida-district',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]|\.\d{3}/g, ''), when, 'SUMMARY:' + q(e.title), 'LOCATION:' + q(e.place), 'DESCRIPTION:' + q([e.church, e.description].filter(Boolean).join(' - ')), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}

  a.download = (ev.title || 'event').replace(/[^\w]+/g, '-').slice(0, 40) + '.ics'; document.body.appendChild(a); a.click(); a.remove();
});

/* ---------- motion and polish ---------- */
let io = null;
function reveal() {
  if (REDUCE || !('IntersectionObserver' in window)) return;
  if (!io) io = new IntersectionObserver(es => es.forEach(en => {
    if (!en.isIntersecting) return; const el = en.target; io.unobserve(el); el.classList.add('in'); el.dataset.seen = '1';
    setTimeout(() => el.classList.remove('rv', 'in'), 1200);
  }), { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
  document.querySelectorAll('.section-head,.stat,.news,.church,.event,.card,.leader,.verify,.contact,.verse,.mapwrap,.gal,.gal-empty').forEach(el => {
    if (el.dataset.seen || el.classList.contains('rv')) return;
    if (el.getBoundingClientRect().top < innerHeight * 0.95) { el.dataset.seen = '1'; return; }      /* already on screen: no flash */
    const k = Array.prototype.indexOf.call(el.parentNode.children, el);
    el.style.setProperty('--d', Math.min(k, 6) * 0.07 + 's'); el.classList.add('rv'); io.observe(el);
  });
}
function countUp() {
  document.querySelectorAll('.stat b[data-n]').forEach(b => {
    const n = +b.dataset.n; if (REDUCE || n < 2) return; const t0 = performance.now(); b.textContent = '0';
    const step = t => { const p = Math.min(1, (t - t0) / 1100); b.textContent = Math.round(n * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

  if ('IntersectionObserver' in window) {
    const o = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => { const on = a.getAttribute('href') === '#' + en.target.id; a.classList.toggle('on', on); if (on) { const n = a.parentElement; if (n && n.scrollWidth > n.clientWidth) n.scrollTo({ left: a.offsetLeft - (n.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' }); } }); }), { rootMargin: '-35% 0px -60% 0px' });
    links.forEach(a => { const s = document.querySelector(a.getAttribute('href')); if (s) o.observe(s); });
    const mo = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { ensureMap(); mo.disconnect(); } }, { rootMargin: '400px' }); mo.observe($('#map'));
  } else ensureMap();
  const bar = $('#progress'), upd = () => { const h = document.documentElement, mx = h.scrollHeight - h.clientHeight; bar.style.width = (mx > 0 ? Math.min(100, h.scrollTop / mx * 100) : 0) + '%'; };
  addEventListener('scroll', upd, { passive: true }); upd();
  if ('serviceWorker' in navigator && location.protocol === 'https:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

initFx();
renderAll();
readVerifyHash();
loadSheets().then(renderAll);
</script>
