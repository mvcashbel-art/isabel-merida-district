<!--
  Tubod site: link back to the district site.
  1. Paste the <style> block into your Tubod page's CSS and the <div> right after <body>.
  2. Change DISTRICT_URL to the address of the district website.
  Then, on the district site, put the Tubod site address in the Tubod entry's `website` field.

  To show Tubod announcements on the district page: in your Tubod Google Sheet publish the
  announcements tab and the events tab as CSV (File > Share > Publish to web > CSV), using these column
  names in row 1:  title, date (YYYY-MM-DD), church, body, pinned   and   title, date, time, place, church, description.
  Paste the two links into CONFIG.feeds in the district index.html.
-->
